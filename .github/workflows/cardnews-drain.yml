# 카드뉴스 오토파일럿 — 발행 버튼 회수
# 초안을 만든 잡이 끝난 뒤에 버튼을 눌러도 이 잡이 발행합니다.
name: cardnews-drain

# 2시간마다 띄우고, 한 번 뜨면 110분간 버튼을 지켜봅니다.
#
# 짧은 주기(*/15)는 GitHub 가 대부분 버립니다 — 실측 간격이 28분에서 146분까지
# 튀었습니다. 그래서 "자주 뜨는" 대신 "한 번 뜨면 오래 지켜보는" 쪽으로 갑니다.
#
# 감시를 주기(120분)보다 짧게 잡은 이유: 더 길게 잡으면 다음 실행이 대기열에
# 쌓였다가 그 다음 실행에 밀려 cancelled 로 남습니다. 동작은 정상인데 Actions
# 탭이 취소 기록으로 뒤덮여 고장난 것처럼 보입니다. 지금은 모든 실행이 정상
# 종료하고, 비는 10분에 눌린 버튼도 다음 실행이 뜨는 즉시 처리됩니다
# (텔레그램이 응답을 24시간 보관합니다).
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# 예약이 밀려 겹치더라도 한 번에 하나만 돌게 합니다.
concurrency:
  group: cardnews-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 118
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        working-directory: cardnews-autopilot
        run: npm ci --omit=optional

      - name: 발행 버튼 확인
        working-directory: cardnews-autopilot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/drain.mjs --watch --minutes 110

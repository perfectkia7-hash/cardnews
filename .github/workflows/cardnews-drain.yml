# 카드뉴스 오토파일럿 — 발행 버튼 회수
# 초안을 만든 잡이 끝난 뒤에 버튼을 눌러도 이 잡이 발행합니다.
name: cardnews-drain

# 2시간마다 띄웁니다. 짧은 주기(*/15)는 GitHub 가 대부분 버립니다 —
# 실측 간격이 28분에서 146분까지 튀었습니다. 그래서 "자주 뜨는" 대신
# "한 번 뜨면 오래 지켜보는" 쪽으로 갑니다.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# 한 번에 하나만 돌되, 겹친 실행은 취소하지 않고 대기시킵니다.
# 그래서 5시간 50분짜리 감시가 끝나는 순간 대기하던 실행이 곧바로 이어받아,
# 예약이 몇 번 밀려도 지켜보는 구간이 끊기지 않습니다.
concurrency:
  group: cardnews-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub 잡 상한이 360분입니다
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        working-directory: cardnews-autopilot
        run: npm ci --omit=optional

      - name: 발행 버튼 확인
        working-directory: cardnews-autopilot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/drain.mjs --watch --minutes 350

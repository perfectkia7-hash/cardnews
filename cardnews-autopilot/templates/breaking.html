<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>breaking</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ── breaking · 속보/이슈용 고대비 강조형 ────────────────── */
:root {
  --accent: #E4002B;
  --bg:     #0E0E10;
  --fg:     #FFFFFF;
  --muted:  #9A9AA2;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #333;
  font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  -webkit-font-smoothing: antialiased;
}
#deck { display: flex; flex-direction: column; gap: 24px; }

.card {
  position: relative;
  width: 1080px; height: 1350px;
  background: var(--bg); color: var(--fg);
  padding: 88px 80px;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* 우측 상단 대각선 액센트 */
.card::after {
  content: ''; position: absolute; top: -180px; right: -180px;
  width: 520px; height: 520px; background: var(--accent);
  transform: rotate(45deg); opacity: .16;
}

.badge {
  align-self: flex-start;
  background: var(--accent); color: #fff;
  font-size: 28px; font-weight: 900; letter-spacing: .18em;
  padding: 14px 26px; margin-bottom: 48px;
}
.cover .badge { font-size: 32px; padding: 18px 32px; }

.fit {
  flex: 1; font-size: 100px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center;
}

.headline {
  font-size: .76em; font-weight: 900; line-height: 1.22;
  letter-spacing: -.035em; word-break: keep-all;
}
.headline mark { background: none; color: var(--accent); }
.body {
  font-size: .345em; font-weight: 400; line-height: 1.66;
  color: #D4D4DA; margin-top: .38em; word-break: keep-all;
}
/* **강조** 는 <b> 로 변환된다 (templates/_engine.js). 본문보다 진하게. */
.body b, .desc b { font-weight: 700; color: var(--fg); }

.cover .headline { font-size: 1.0em; line-height: 1.14; }
.cover .body { font-size: .33em; color: var(--muted); margin-top: .52em; }

/* 본문 카드 왼쪽 세로 바 */
.content .fit { border-left: 8px solid var(--accent); padding-left: 40px; }

.outro { text-align: center; }
.outro .badge { align-self: center; }
.outro .fit { justify-content: center; }
.outro .headline { font-size: .82em; }

.src { margin-top: 40px; font-size: 24px; color: var(--muted); }

.foot {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 44px; padding-top: 28px; border-top: 2px solid #262629;
  font-size: 26px; color: var(--muted);
}
.foot .handle { font-weight: 800; color: #fff; }
.foot .swipe, .foot .page { font-weight: 800; color: var(--accent); }
</style>
</head>
<body>
<div id="deck"></div>
<script src="_engine.js"></script>
<script>
renderDeck({
  defaultAccent: '#E4002B',
  body(card, { brand }) {
    const label =
      card.kind === 'cover' ? (brand.label || 'BREAKING')
      : card.kind === 'outro' ? 'THANKS'
      : `NO. ${String(card.index - 1).padStart(2, '0')}`;
    return `
      <div class="badge">${label}</div>
      <div class="fit">
        ${parts.headline(card)}
        ${parts.body(card)}
      </div>
      ${parts.source(card)}
      ${parts.footer(card, brand)}
    `;
  },
});
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>minimal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ── minimal · 밝고 조용한 정보 전달형 ───────────────────── */
:root {
  --accent: #1A1A1A;
  --bg:     #FAFAF7;
  --fg:     #16161A;
  --muted:  #8A8A85;
  --line:   #E2E2DC;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #333;
  font-family: Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  -webkit-font-smoothing: antialiased;
}
#deck { display: flex; flex-direction: column; gap: 24px; }

.card {
  position: relative;
  width: 1080px; height: 1350px;
  background: var(--bg);
  color: var(--fg);
  padding: 96px 88px;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* 상단 얇은 강조선 */
.card::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 100%; height: 10px; background: var(--accent);
}

.head { display: flex; align-items: center; gap: 14px; margin-bottom: 56px; }
.head .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.head .tag {
  font-size: 26px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; color: var(--muted);
}

/* 글자가 넘치면 엔진이 이 폰트 크기를 줄인다 */
.fit {
  flex: 1; font-size: 100px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center;
}

.headline { font-size: .70em; font-weight: 800; line-height: 1.28; letter-spacing: -.028em; word-break: keep-all; }
.body {
  font-size: .355em; font-weight: 400; line-height: 1.68;
  color: #40403C; margin-top: .34em; word-break: keep-all;
}
/* **강조** 는 <b> 로 변환된다 (templates/_engine.js). 본문보다 진하게. */
.body b, .desc b { font-weight: 700; color: var(--fg); }

/* 표지는 더 크게, 부제는 회색으로 */
.cover .headline { font-size: .92em; line-height: 1.20; letter-spacing: -.038em; }
.cover .body { font-size: .34em; color: var(--muted); margin-top: .5em; }

.outro { align-items: center; justify-content: center; text-align: center; }
.outro .fit { justify-content: center; }
.outro .headline { font-size: .78em; }

.src {
  margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line);
  font-size: 24px; color: var(--muted); letter-spacing: -.01em;
}

.foot {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 48px; font-size: 26px; color: var(--muted); letter-spacing: -.01em;
}
.foot .handle { font-weight: 700; color: var(--accent); }
.foot .swipe { font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<div id="deck"></div>
<script src="_engine.js"></script>
<script>
renderDeck({
  defaultAccent: '#1A1A1A',
  body(card, { brand }) {
    const tag = card.kind === 'cover' ? (brand.label || 'NEWS') : 'ISSUE';
    return `
      <div class="head"><span class="dot"></span><span class="tag">${tag}</span></div>
      <div class="fit">
        ${parts.headline(card)}
        ${parts.body(card)}
      </div>
      ${parts.source(card)}
      ${parts.footer(card, brand)}
    `;
  },
});
</script>
</body>
</html>
